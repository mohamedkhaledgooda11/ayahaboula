    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      
      // Auto-load saved pixel ID if available before React mounts
      try {
        var rawSettings = localStorage.getItem('beauty_salon_aya_settings');
        if (rawSettings) {
          var parsed = JSON.parse(rawSettings);
          if (parsed && parsed.metaPixelId) {
            var cleanId = parsed.metaPixelId.trim().replace(/[^0-9]/g, '');
            if (cleanId) {
              fbq('init', cleanId);
              fbq('track', 'PageView');
              window.__currentMetaPixelId = cleanId;
            }
          }
        }
      } catch(e) {}
    </script>
    <!-- End Meta Pixel Code -->
